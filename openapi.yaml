      required: [id, useCaseId, releaseId, status]
      properties:
        id:
          type: string
        useCaseId:
          type: string
        releaseId:
          type: string
        siteIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, degraded, suspended, retired]
        activatedAt:
          type: string
          format: date-time
        suspensionReason:
          type: string
        shelfwareRisk:
          type: string
          enum: [none, watch, high]
