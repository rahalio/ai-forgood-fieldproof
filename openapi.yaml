          enum: [device_availability, connectivity, mains_power, language, literacy, operator_capacity, equipment_cost]
        severity:
          type: string
          enum: [blocking, degrading, tolerable]
        observation:
          type: string
        fallbackPath:
          type: string
        assessedBy:
          type: string
        assessedAt:
          type: string
          format: date-time
    Deployment:
