      type: object
      required: [useCaseId, version]
      properties:
        useCaseId:
          type: string
        version:
          type: string
        builtBy:
          type: string
          enum: [internal_team, vendor, volunteer, research_group]
        dataAssetIds:
          type: array
          items:
            type: string
        explainability:
          $ref: "#/components/schemas/ExplainabilityMethod"
        humanInLoop:
          $ref: "#/components/schemas/HumanInLoopPolicy"
    ExplainabilityMethod:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [none, feature_attribution, salient_region, decision_rules, case_based, human_readable_report]
        audience:
          type: string
          enum: [reviewer_only, field_staff, affected_individual, regulator]
        appealPathDescribed:
          type: boolean
    HumanInLoopPolicy:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, review_before_action, review_on_exception, dual_review, advisory_only]
        reviewerRole:
          type: string
        disclaimerShownToUser:
          type: boolean
        fallbackWhenUnavailable:
          type: string
    ValidationRun:
      type: object
      required: [id, releaseId, overallMetric, subgroupResults]
