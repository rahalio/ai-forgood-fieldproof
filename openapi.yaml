        id:
          type: string
        releaseId:
          type: string
        datasetRef:
          type: string
        overallMetric:
          type: object
          properties:
            name:
              type: string
            value:
              type: number
              format: float
        subgroupResults:
          type: array
          items:
            type: object
            required: [subgroup, value]
            properties:
              subgroup:
                type: string
              value:
                type: number
                format: float
              sampleSize:
                type: integer
        siteResults:
          type: array
          items:
            type: object
            properties:
              siteId:
                type: string
              value:
                type: number
                format: float
        worstSubgroupGap:
          type: number
          format: float
        toleranceBreached:
          type: boolean
        redTeamFindings:
          type: array
          items:
            type: string
        runAt:
          type: string
          format: date-time
    ValidationRunCreate:
      type: object
      required: [overallMetric, subgroupResults]
      properties:
        datasetRef:
          type: string
        overallMetric:
          type: object
          properties:
            name:
              type: string
            value:
              type: number
              format: float
        subgroupResults:
          type: array
          items:
            type: object
            required: [subgroup, value]
            properties:
              subgroup:
                type: string
              value:
                type: number
                format: float
              sampleSize:
                type: integer
        siteResults:
          type: array
          items:
            type: object
            properties:
              siteId:
                type: string
              value:
                type: number
                format: float
        redTeamFindings:
          type: array
          items:
            type: string
    FieldSite:
      type: object
      required: [id, name, country]
      properties:
        id:
          type: string
        name:
          type: string
        country:
          type: string
        operatingPartner:
          type: string
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/LastMileConstraint"
        retrainingRequired:
          type: boolean
          description: True where local conditions differ enough to need site-specific training data
    FieldSiteCreate:
      type: object
      required: [name, country]
      properties:
